<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭成长积分约定 · 实时预览</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --bg:#f5f3ef; --card:#ffffff; --ink:#2c2c2c; --muted:#888;
    --accent:#e8743b; --accent2:#f6b352; --line:#ece8e1;
    --th:#fff7ef; --zebra:#faf8f4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.75; font-size:16px;
    overflow-x:hidden;            /* 防止长链接把页面撑宽、可横向拖动 */
  }
  /* 顶部导航 */
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }
  header .tabs{display:flex; flex-wrap:wrap; gap:8px; flex:1;}
  #crumb{display:none; flex:1; font-weight:600; color:#b8531f; font-size:15px; align-self:center;}
  body.nav-collapsed header .tabs{display:none;}
  body.nav-collapsed #crumb{display:inline-block;}
  #navToggle{font-size:15px; line-height:1; padding:5px 10px;}
  .tab{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:7px 14px; border-radius:999px; cursor:pointer; font-size:14px;
    transition:.15s; white-space:nowrap;
  }
  .tab:hover{border-color:var(--accent2);}
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent; box-shadow:0 2px 8px rgba(232,116,59,.3);}
  .ctrls{display:flex; gap:10px; align-items:center; font-size:13px; color:var(--muted);}
  .ctrls label{display:flex; gap:5px; align-items:center; cursor:pointer;}
  .btn{border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px;}
  .btn:hover{border-color:var(--accent2);}
  #status{font-size:12px; color:var(--muted); min-width:90px;}
  #status .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#bbb; margin-right:5px; vertical-align:middle;}
  #status.live .dot{background:#48b15a; box-shadow:0 0 0 3px rgba(72,177,90,.18);}
  #status.err .dot{background:#e0524d;}
  /* 内容卡片 */
  main{max-width:920px; margin:26px auto; padding:0 16px;}
  .card{
    background:var(--card); border-radius:16px; padding:40px 48px;
    box-shadow:0 6px 24px rgba(0,0,0,.06); border:1px solid var(--line);
  }
  .md h1{font-size:30px; margin:.2em 0 .6em; line-height:1.3; border-bottom:3px solid var(--accent2); padding-bottom:.3em;}
  .md h2{font-size:23px; margin:1.5em 0 .5em; color:#b8531f;}
  .md h3{font-size:19px; margin:1.3em 0 .4em; color:#444;}
  .md h4{font-size:17px; margin:1.1em 0 .3em; color:#555;}
  .md p{margin:.6em 0;}
  .md ul,.md ol{padding-left:1.4em;}
  .md li{margin:.25em 0;}
  .md strong{color:#b8531f;}
  .md{overflow-wrap:anywhere;}
  .md a{color:#c2611f; word-break:break-all; overflow-wrap:anywhere;}
  .md hr{border:none; border-top:1px dashed var(--line); margin:1.6em 0;}
  .md blockquote{
    margin:1em 0; padding:.6em 1.1em; background:var(--th);
    border-left:4px solid var(--accent2); border-radius:0 8px 8px 0; color:#6a5a48;
  }
  .md blockquote p{margin:.3em 0;}
  .md table{border-collapse:collapse; width:100%; margin:1.2em 0; font-size:14.5px; overflow:hidden; border-radius:10px; box-shadow:0 1px 0 var(--line);}
  .md th,.md td{border:1px solid var(--line); padding:9px 12px; text-align:left; vertical-align:top;}
  .md th{background:var(--th); font-weight:600; color:#b8531f;}
  .md tbody tr:nth-child(even){background:var(--zebra);}
  .md code{background:#f0ece4; padding:.1em .4em; border-radius:5px; font-size:.9em;}
  /* 分页符在屏幕上显示为分隔条 */
  .md div[style*="page-break"]{
    height:0; border-top:2px dashed var(--accent2); margin:2.4em 0;
    position:relative;
  }
  .md div[style*="page-break"]::after{
    content:"✂ 分页"; position:absolute; right:0; top:-.9em; font-size:11px;
    color:var(--accent); background:var(--card); padding:0 8px;
  }
  footer{text-align:center; color:var(--muted); font-size:12px; padding:20px;}
  /* ===== 每日积分卡 ===== */
  .pc h1{font-size:27px; border-bottom:3px solid var(--accent2); padding-bottom:.3em; margin:.1em 0 .7em;}
  .pc-head{display:flex; flex-wrap:wrap; gap:18px; margin-bottom:18px; font-size:15px;}
  .pc-head label{display:flex; align-items:center; gap:6px; color:#555;}
  .pc-head input{border:none; border-bottom:1.5px solid var(--line); padding:4px 6px; font-size:15px; font-family:inherit; background:transparent; min-width:110px;}
  .pc-head input:focus{outline:none; border-color:var(--accent);}
  .pc-sec{margin:18px 0;}
  .pc-sec h3{font-size:17px; margin:0 0 8px; display:flex; align-items:center; gap:8px;}
  .pc-sec h3 .tag{font-size:12px; font-weight:400; color:var(--muted);}
  table.pc-t{border-collapse:collapse; width:100%; font-size:14.5px;}
  table.pc-t th,table.pc-t td{border:1px solid var(--line); padding:6px 8px; text-align:center;}
  table.pc-t th{background:var(--th); color:#b8531f; font-weight:600;}
  table.pc-t td:first-child{text-align:left;}
  table.pc-t input[type=text]{width:100%; border:none; font-size:14.5px; font-family:inherit; background:transparent;}
  table.pc-t input[type=number]{width:52px; border:1px solid var(--line); border-radius:6px; padding:4px; text-align:center; font-family:inherit;}
  table.pc-t select{border:1px solid var(--line); border-radius:6px; padding:4px 6px; font-family:inherit; background:#fff;}
  table.pc-t input:focus,table.pc-t select:focus{outline:none; border-color:var(--accent);}
  .pc-sub{font-weight:600; color:#b8531f;}
  .addrow{margin-top:8px; border:1px dashed var(--line); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; color:var(--muted);}
  .addrow:hover{border-color:var(--accent2); color:var(--accent);}
  .delrow{border:none; background:transparent; color:#ccc; cursor:pointer; font-size:16px; line-height:1;}
  .delrow:hover{color:#e0524d;}
  /* 结算区 */
  .pc-calc{display:flex; flex-wrap:wrap; gap:14px; align-items:stretch; margin:22px 0;}
  .pc-box{flex:1; min-width:120px; background:var(--zebra); border:1px solid var(--line); border-radius:12px; padding:14px 16px; text-align:center;}
  .pc-box .lbl{font-size:13px; color:var(--muted);}
  .pc-box .num{font-size:30px; font-weight:700; margin-top:4px;}
  .pc-box.final{background:linear-gradient(135deg,#fff7ef,#fdeede); border-color:var(--accent2);}
  .pc-box.final .num{font-size:40px; color:var(--accent);}
  /* 处置档 */
  .tiers{display:grid; grid-template-columns:1fr; gap:8px; margin:14px 0;}
  .tier{border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:14px; opacity:.45; transition:.2s;}
  .tier .t-h{font-weight:700;}
  .tier.on{opacity:1; border-color:var(--accent); background:var(--th); box-shadow:0 2px 10px rgba(232,116,59,.15);}
  .star{display:inline-block; margin-left:10px; padding:3px 10px; border-radius:999px; font-size:13px; background:#eee; color:#999;}
  .star.on{background:linear-gradient(135deg,#f6b352,#e8743b); color:#fff;}
  .pc-foot{display:flex; flex-wrap:wrap; gap:18px; margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); font-size:15px; color:#555;}
  .pc-foot label{display:flex; align-items:center; gap:6px;}
  .pc-foot input{border:none; border-bottom:1.5px solid var(--line); padding:4px 6px; font-family:inherit; background:transparent; min-width:90px;}
  .pc-actions{margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent; font-weight:600;}
  .btn.primary:hover{filter:brightness(1.05);}
  /* 登录面板 */
  .auth-wrap{display:flex; justify-content:center; padding:24px 0;}
  .auth-box{width:100%; max-width:360px; text-align:center;}
  .auth-box h2{font-size:21px; color:#b8531f; margin:.2em 0 .4em;}
  .auth-tip{font-size:13px; color:var(--muted); margin:0 0 18px;}
  .auth-box input{display:block; width:100%; margin:10px 0; padding:11px 14px; font-size:15px; font-family:inherit;
    border:1px solid var(--line); border-radius:10px; background:#fff;}
  .auth-box input:focus{outline:none; border-color:var(--accent);}
  .auth-btns{display:flex; gap:10px; margin-top:14px;}
  .auth-btns .btn{flex:1; padding:11px; font-size:15px; border-radius:10px;}
  .auth-msg{min-height:20px; font-size:13px; margin:6px 0;}
  .auth-msg.err{color:#e0524d;} .auth-msg.ok{color:#48b15a;}
  /* 积分卡用户栏 + 保存状态 */
  .pc-userbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px; color:#666;
    background:var(--zebra); border:1px solid var(--line); border-radius:10px; padding:8px 14px; margin-bottom:14px;}
  .pc-userbar b{color:#b8531f;}
  .pc-userbar .btn{padding:4px 10px; font-size:12px;}
  .savest{font-size:12.5px; color:var(--muted); margin-left:auto;}
  .savest.ok{color:#48b15a;} .savest.err{color:#e0524d;}
  /* ===== 移动端适配 ===== */
  @media (max-width:600px){
    body{font-size:15px; line-height:1.7;}
    header{padding:8px 10px; gap:6px;}
    .tab{padding:6px 10px; font-size:13px;}
    .ctrls{gap:6px; font-size:12px;}
    #status{display:none;}                 /* 省空间 */
    .ctrls label{display:none;}            /* 隐藏“自动刷新”文字，移动端仍默认轮询 */
    .btn{padding:5px 9px; font-size:12px;}
    main{margin:12px auto; padding:0 8px;}
    .card{padding:18px 14px; border-radius:12px;}
    .md h1{font-size:22px;}
    .md h2{font-size:18px;}
    .md h3{font-size:16px;}
    .md p,.md li{font-size:15px;}
    /* 宽表格改为可横向滑动 */
    .md table{display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; font-size:13px; border-radius:8px;}
    .md th,.md td{padding:6px 8px;}
    .md blockquote{padding:.5em .8em;}
    /* 每日积分卡 */
    .pc h1{font-size:20px;}
    /* 录入表改为堆叠卡片：行为输入独占一行，控件一行 */
    table.pc-t, table.pc-t tbody{display:block;}
    table.pc-t thead{display:none;}
    table.pc-t tr{display:flex; flex-wrap:wrap; align-items:center; gap:8px;
      border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; background:#fff;}
    table.pc-t td{display:block; border:none; padding:0;}
    table.pc-t td:nth-child(1){flex:1 1 100%;}                 /* 行为输入：整行 */
    table.pc-t td:nth-child(2){flex:1 1 auto;}                 /* 等级 */
    table.pc-t td:nth-child(3){flex:0 0 auto;}                 /* 次数 */
    table.pc-t td:nth-child(4){flex:0 0 auto; font-size:13px; color:var(--muted);} /* 小计 */
    table.pc-t td:nth-child(5){flex:0 0 auto; margin-left:auto;} /* 删除靠右 */
    table.pc-t input[type=text]{width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:15px; background:#fff;}
    table.pc-t select{width:100%; padding:8px 6px; font-size:14px;}
    table.pc-t input[type=number]{width:54px; padding:8px 4px; font-size:15px;}
    .delrow{font-size:20px; padding:4px 8px;}
    .addrow{width:100%; padding:10px; font-size:14px;}
    .pc-head{gap:10px; font-size:14px;}
    .pc-box{min-width:calc(50% - 7px);}    /* 结算框每行两个 */
    .pc-box .num{font-size:26px;}
    .pc-box.final .num{font-size:32px;}
    .pc-foot{gap:12px; font-size:14px;}
  }
  /* 打印 */
  @media print{
    header,footer,.addrow,.delrow,.pc-actions{display:none;}
    body{background:#fff;}
    main{margin:0; max-width:none; padding:0;}
    .card{box-shadow:none; border:none; border-radius:0; padding:0;}
    .md div[style*="page-break"]{page-break-after:always; border:none; height:0; margin:0;}
    .md div[style*="page-break"]::after{display:none;}
    .tier{opacity:1 !important;}
  }
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <span id="crumb"></span>
  <div class="ctrls">
    <span id="status"><span class="dot"></span>加载中…</span>
    <label><input type="checkbox" id="auto" checked> 自动刷新</label>
    <button class="btn" id="reload">↻ 刷新</button>
    <button class="btn" id="print">🖨 打印</button>
    <button class="btn" id="navToggle" title="收起 / 展开导航">⊟</button>
  </div>
</header>

<main>
  <div class="card"><div class="md" id="content">正在加载…</div></div>
</main>
<footer>家庭成长积分约定 · 本页实时读取同目录 Markdown 文件</footer>

<script>
  const DOCS = [
    { id:'contract', title:'🌟 家庭加分扣分明细表', file:'家庭行为加分扣分明细表.md' },
    { id:'school',   title:'🏫 学校加分扣分明细表',     file:'学校行为加分扣分明细表.md' },
    { id:'rewards',  title:'🎁 成长积分兑换价目表',     file:'成长积分兑换价目表.md' },
    { id:'manual',   title:'📖 家长执行手册',           file:'家长执行手册.md' },
    { id:'card',     title:'🗓 每日积分卡（可填写）',   type:'card' },
  ];

  marked.setOptions({ gfm:true, breaks:false });

  let current = DOCS[0];
  let lastText = '';
  const elTabs = document.getElementById('tabs');
  const elContent = document.getElementById('content');
  const elStatus = document.getElementById('status');
  const elAuto = document.getElementById('auto');
  const elCrumb = document.getElementById('crumb');
  const elNavToggle = document.getElementById('navToggle');

  // 导航收缩 / 展开（状态存 localStorage）
  function applyCollapsed(collapsed){
    document.body.classList.toggle('nav-collapsed', collapsed);
    elNavToggle.textContent = collapsed ? '☰' : '⊟';
    elNavToggle.title = collapsed ? '展开导航' : '收起导航';
  }
  elNavToggle.onclick = ()=>{
    const collapsed = !document.body.classList.contains('nav-collapsed');
    applyCollapsed(collapsed);
    localStorage.setItem('navCollapsed', collapsed ? '1' : '0');
  };

  // 建标签
  DOCS.forEach(d=>{
    const b = document.createElement('button');
    b.className='tab'; b.textContent=d.title; b.dataset.id=d.id;
    b.onclick=()=>switchDoc(d);
    elTabs.appendChild(b);
  });

  function highlightTab(){
    [...elTabs.children].forEach(b=>b.classList.toggle('active', b.dataset.id===current.id));
  }

  function setStatus(state, text){
    elStatus.className = state; // '', 'live', 'err'
    elStatus.innerHTML = '<span class="dot"></span>' + text;
  }

  async function load(force){
    if(current.type==='card') return; // 积分卡不轮询
    try{
      const res = await fetch(encodeURIComponent(current.file) + '?t=' + Date.now(), {cache:'no-store'});
      if(!res.ok) throw new Error(res.status);
      const text = await res.text();
      if(force || text !== lastText){
        lastText = text;
        elContent.innerHTML = marked.parse(text);
        const now = new Date();
        const hh = String(now.getHours()).padStart(2,'0');
        const mm = String(now.getMinutes()).padStart(2,'0');
        const ss = String(now.getSeconds()).padStart(2,'0');
        setStatus('live', `已更新 ${hh}:${mm}:${ss}`);
      }
    }catch(e){
      setStatus('err', '读取失败（需本地服务器）');
    }
  }

  function switchDoc(d){
    current = d; lastText=''; highlightTab();
    elCrumb.textContent = d.title;
    localStorage.setItem('activeDoc', d.id);   // 记住当前标签
    if(d.type==='card'){ renderCard(); setStatus('live','积分卡 · 可填写'); return; }
    elContent.innerHTML='加载中…';
    load(true);
  }

  /* ===== 每日积分卡 ===== */
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function opts(list, sel){ return list.map(([v,l])=>`<option value="${v}" ${String(sel)===String(v)?'selected':''}>${l}</option>`).join(''); }

  function deductRow(text='', lv='1', ct=1){
    return `<tr>
      <td><input type="text" placeholder="违规行为描述" value="${esc(text)}"></td>
      <td><select class="lv">${opts([['1','一级 −1'],['3','二级 −3'],['5','三级 −5']], lv)}</select></td>
      <td><input type="number" class="ct" min="1" value="${esc(ct)}"></td>
      <td class="rt pc-sub">−1</td>
      <td><button class="delrow" title="删除">✕</button></td>
    </tr>`;
  }
  function addRow(text='', lv='2', ct=1){
    return `<tr>
      <td><input type="text" placeholder="良好行为描述" value="${esc(text)}"></td>
      <td><select class="lv">${opts([['2','主动 +2'],['1','+1（提醒后 / 小项主动）'],['0.5','+0.5（提醒后小项）']], lv)}</select></td>
      <td><input type="number" class="ct" min="1" value="${esc(ct)}"></td>
      <td class="rt pc-sub">+1</td>
      <td><button class="delrow" title="删除">✕</button></td>
    </tr>`;
  }

  /* ===== 登录 / 认证 ===== */
  const AUTH = {
    token: ()=>localStorage.getItem('authToken'),
    user:  ()=>localStorage.getItem('authUser'),
    set:   (t,u)=>{ localStorage.setItem('authToken',t); localStorage.setItem('authUser',u); },
    clear: ()=>{ localStorage.removeItem('authToken'); localStorage.removeItem('authUser'); },
  };
  async function api(path, opts={}){
    const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
    const t = AUTH.token(); if(t) headers['Authorization'] = 'Bearer '+t;
    const res = await fetch(path, { method:opts.method||'GET', headers, body:opts.body?JSON.stringify(opts.body):undefined });
    let j={}; try{ j=await res.json(); }catch{}
    if(!res.ok) throw new Error(j.error || ('请求失败 '+res.status));
    return j;
  }
  function handleAuthErr(e){ if(/登录/.test(e.message||'')){ AUTH.clear(); renderLogin(); return true; } return false; }

  function renderLogin(){
    elContent.innerHTML = `
    <div class="auth-wrap"><div class="auth-box">
      <h2>🔒 登录后填写每日积分卡</h2>
      <p class="auth-tip">积分卡数据会和你的账号绑定、存到云端，换设备也能看。明细表和手册无需登录。</p>
      <input id="auUser" placeholder="用户ID（字母 / 数字 / 中文）" autocomplete="username">
      <input id="auPass" type="password" placeholder="密码（至少 4 位）" autocomplete="current-password">
      <div class="auth-msg" id="auMsg"></div>
      <div class="auth-btns">
        <button class="btn primary" id="auLogin">登录</button>
        <button class="btn" id="auReg">注册新账号</button>
      </div>
    </div></div>`;
    const msg = (t,cls='')=>{ const m=document.getElementById('auMsg'); m.textContent=t||''; m.className='auth-msg '+cls; };
    const creds = ()=>({ userId:document.getElementById('auUser').value.trim(), password:document.getElementById('auPass').value });
    async function go(path){
      const c = creds();
      if(!c.userId || !c.password){ msg('请输入用户ID和密码','err'); return; }
      try{ msg('处理中…'); const j=await api(path,{method:'POST',body:c}); AUTH.set(j.token,j.userId); renderCard(); }
      catch(e){ msg(e.message,'err'); }
    }
    document.getElementById('auLogin').onclick = ()=>go('/api/login');
    document.getElementById('auReg').onclick   = ()=>go('/api/register');
    document.getElementById('auPass').addEventListener('keydown', e=>{ if(e.key==='Enter') go('/api/login'); });
  }

  function renderCard(){
    if(!AUTH.token()){ renderLogin(); return; }
    const _t = new Date();
    const today = _t.getFullYear()+'-'+String(_t.getMonth()+1).padStart(2,'0')+'-'+String(_t.getDate()).padStart(2,'0');
    elContent.innerHTML = `
    <div class="pc">
      <div class="pc-userbar">👤 <b>${esc(AUTH.user())}</b> · 已登录　<button class="btn" id="logout">退出</button> <span class="savest" id="saveState"></span></div>
      <h1>🗓 每日积分卡</h1>
      <div class="pc-head">
        <label>宝贝姓名：<input type="text" id="pcName" placeholder="________"></label>
        <label>日期：<input type="date" id="pcDate"></label>
        <label>每日基础分：<strong style="color:#b8531f;font-size:18px">0</strong>（加减相抵，可正可负）</label>
      </div>

      <div class="pc-sec">
        <h3>➖ 扣分记录 <span class="tag">（一级−1 / 二级−3 / 三级−5，反复逐次扣）</span></h3>
        <table class="pc-t">
          <thead><tr><th style="width:46%">违规行为</th><th>等级</th><th>次数</th><th>小计</th><th></th></tr></thead>
          <tbody id="dBody"></tbody>
        </table>
        <button class="addrow" data-add="d">＋ 添加一行</button>
      </div>

      <div class="pc-sec">
        <h3>➕ 加分记录 <span class="tag">（主动做事/整理/友好/认错 +1，突出表现 +2）</span></h3>
        <table class="pc-t">
          <thead><tr><th style="width:46%">良好行为</th><th>类型</th><th>次数</th><th>小计</th><th></th></tr></thead>
          <tbody id="aBody"></tbody>
        </table>
        <button class="addrow" data-add="a">＋ 添加一行</button>
      </div>

      <div class="pc-calc">
        <div class="pc-box"><div class="lbl">基础分</div><div class="num">0</div></div>
        <div class="pc-box"><div class="lbl">总加分</div><div class="num" id="sumA" style="color:#48b15a">+0</div></div>
        <div class="pc-box"><div class="lbl">总扣分</div><div class="num" id="sumD" style="color:#e0524d">−0</div></div>
        <div class="pc-box final"><div class="lbl">今日得分</div><div class="num" id="remain">0</div></div>
      </div>

      <div class="pc-sec">
        <h3>📊 今日处置档 <span class="tag">（按今日得分自动判定；奖励另靠积分兑换）</span></h3>
        <div class="tiers">
          <div class="tier" data-min="0"><span class="t-h">≥ 0 分 😀</span>　今天没有净失分，表现 OK。</div>
          <div class="tier" data-min="-4" data-max="-0.001"><span class="t-h">−1 ~ −4 分 🙂</span>　口头提醒 + 用 2 句话复盘。</div>
          <div class="tier" data-min="-9" data-max="-4.001"><span class="t-h">−5 ~ −9 分 😐</span>　冷静角 5 分钟 + 复盘。</div>
          <div class="tier" data-max="-9.001"><span class="t-h">≤ −10 分 😟</span>　冷静角 7 分钟 + 1 项家务 + 书面反思 + 睡前谈心。</div>
        </div>
      </div>

      <div class="pc-foot">
        <span>📒 成长存折余额：<strong id="bankBalance" style="color:#b8531f;font-size:19px">…</strong> 分</span>
        <span>今日预计 <strong id="todayNet" style="color:#48b15a">0</strong> 分（保存后自动入账）</span>
      </div>
      <div class="pc-foot" style="border:none;padding-top:0">
        <label>🎁 兑换扣减：<input type="number" id="redeemPts" min="1" placeholder="花掉的分" style="width:90px"></label>
        <button class="btn" id="redeemBtn">兑换</button>
        <span class="savest" id="redeemState"></span>
        <label style="margin-left:auto">家长签字：<input type="text" id="pcSign" placeholder="________"></label>
      </div>
      <div class="pc-foot" style="border:none;padding-top:0">
        <label style="flex:1">今日复盘 / 备注：<input type="text" id="pcNote" placeholder="我错在……，下次我会……" style="flex:1;min-width:240px"></label>
      </div>

      <div class="pc-actions">
        <button class="btn primary" id="cardSave">💾 保存到云端</button>
        <button class="btn" id="cardPrint">🖨 打印</button>
        <button class="btn" id="cardClear">🧹 清空</button>
      </div>
    </div>`;
    document.getElementById('pcDate').value = today;
    wireCard();
    recalc();
    loadCard();
    loadBank();
  }

  function wireCard(){
    elContent.querySelectorAll('[data-add]').forEach(b=>{
      b.onclick=()=>{
        const isD = b.dataset.add==='d';
        const body = document.getElementById(isD?'dBody':'aBody');
        body.insertAdjacentHTML('beforeend', isD?deductRow():addRow());
        wireRows(); recalc();
      };
    });
    document.getElementById('logout').onclick = ()=>{ AUTH.clear(); renderLogin(); };
    document.getElementById('cardSave').onclick = saveCard;
    document.getElementById('cardPrint').onclick = ()=>window.print();
    document.getElementById('cardClear').onclick = ()=>{
      document.getElementById('dBody').innerHTML = '';
      document.getElementById('aBody').innerHTML = '';
      ['pcName','bankPrev','pcSign','pcNote'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
      wireRows(); recalc();
    };
    document.getElementById('pcDate').addEventListener('change', loadCard);
    document.getElementById('redeemBtn').onclick = redeemPoints;
    wireRows();
  }

  /* ===== 积分卡 ↔ 云端 ===== */
  function serializeCard(){
    const val = id=>{ const el=document.getElementById(id); return el?el.value:''; };
    const rows = sel=>[...document.querySelectorAll(sel+' tr')].map(tr=>({
      t: tr.querySelector('input[type=text]').value,
      lv: tr.querySelector('.lv').value,
      ct: tr.querySelector('.ct').value,
    }));
    return { name:val('pcName'), sign:val('pcSign'), note:val('pcNote'),
             deducts:rows('#dBody'), adds:rows('#aBody') };
  }
  function applyCard(data){
    const set = (id,v)=>{ const el=document.getElementById(id); if(el) el.value = v||''; };
    set('pcName',data.name); set('pcSign',data.sign); set('pcNote',data.note);
    if(data.name) localStorage.setItem('cardName', data.name);
    // 始终按记录重建行（即使为空，也回到默认空行，避免残留上一天的数据）
    const ds = (Array.isArray(data.deducts) && data.deducts.length) ? data.deducts.map(r=>deductRow(r.t,r.lv,r.ct)).join('') : '';
    const as = (Array.isArray(data.adds) && data.adds.length) ? data.adds.map(r=>addRow(r.t,r.lv,r.ct)).join('') : '';
    document.getElementById('dBody').innerHTML = ds;
    document.getElementById('aBody').innerHTML = as;
    wireRows(); recalc();
  }
  // 切换到没有记录的日期 → 重置成空白新卡（仅保留孩子姓名）
  function resetCard(){
    document.getElementById('dBody').innerHTML = '';
    document.getElementById('aBody').innerHTML = '';
    const set = (id,v)=>{ const el=document.getElementById(id); if(el) el.value = v||''; };
    set('pcName', localStorage.getItem('cardName')||'');
    set('pcSign',''); set('pcNote','');
    wireRows(); recalc();
  }
  async function loadCard(){
    const date = document.getElementById('pcDate').value;
    const st = document.getElementById('saveState');
    if(!date) return;
    try{
      st.textContent='读取中…'; st.className='savest';
      const j = await api('/api/card?date='+encodeURIComponent(date));
      if(j.data){ applyCard(j.data); st.textContent='已载入 '+date+' 的记录'; st.className='savest ok'; }
      else { resetCard(); st.textContent='🆕 '+date+' 新的一天，填好后点保存'; st.className='savest'; }
    }catch(e){ if(!handleAuthErr(e)){ st.textContent='读取失败：'+e.message; st.className='savest err'; } }
  }
  async function saveCard(){
    const date = document.getElementById('pcDate').value;
    const st = document.getElementById('saveState');
    if(!date){ st.textContent='请先选日期'; st.className='savest err'; return; }
    try{
      st.textContent='保存中…'; st.className='savest';
      const data = serializeCard();
      if(data.name) localStorage.setItem('cardName', data.name);
      const r = await api('/api/card',{ method:'POST', body:{ date, data } });
      if(r && typeof r.balance==='number') setBank(r.balance);
      st.textContent='✓ 已保存到云端'; st.className='savest ok';
    }catch(e){ if(!handleAuthErr(e)){ st.textContent='保存失败：'+e.message; st.className='savest err'; } }
  }
  function setBank(n){ const el=document.getElementById('bankBalance'); if(el) el.textContent = Math.round((+n||0)*10)/10; }
  async function loadBank(){
    try{ const j=await api('/api/bank'); setBank(j.balance||0); }
    catch(e){ if(!handleAuthErr(e)){ const el=document.getElementById('bankBalance'); if(el) el.textContent='—'; } }
  }
  async function redeemPoints(){
    const inp=document.getElementById('redeemPts'), st=document.getElementById('redeemState');
    const pts=parseFloat(inp.value);
    if(!pts || pts<=0){ st.textContent='请输入要花掉的分数'; st.className='savest err'; return; }
    try{
      st.textContent='处理中…'; st.className='savest';
      const j=await api('/api/bank',{ method:'POST', body:{ redeem:pts } });
      setBank(j.balance); inp.value='';
      st.textContent='✓ 已扣 '+pts+' 分，余额 '+(Math.round(j.balance*10)/10)+' 分'; st.className='savest ok';
    }catch(e){ if(!handleAuthErr(e)){ st.textContent=e.message; st.className='savest err'; } }
  }
  function wireRows(){
    elContent.querySelectorAll('#dBody tr, #aBody tr').forEach(tr=>{
      tr.querySelector('.lv').oninput = recalc;
      tr.querySelector('.ct').oninput = recalc;
      tr.querySelector('.delrow').onclick = ()=>{ tr.remove(); recalc(); };
    });
  }
  function recalc(){
    let totD=0, totA=0;
    document.querySelectorAll('#dBody tr').forEach(tr=>{
      const v=+tr.querySelector('.lv').value, c=Math.max(1,+tr.querySelector('.ct').value||1);
      const s=v*c; totD+=s; tr.querySelector('.rt').textContent='−'+s;
    });
    document.querySelectorAll('#aBody tr').forEach(tr=>{
      const v=+tr.querySelector('.lv').value, c=Math.max(1,+tr.querySelector('.ct').value||1);
      const s=v*c; totA+=s; tr.querySelector('.rt').textContent='+'+s;
    });
    const remain = totA - totD;   // 基础分 0，今日得分 = 加分 − 扣分（可正可负）
    document.getElementById('sumA').textContent='+'+totA;
    document.getElementById('sumD').textContent='−'+totD;
    const rEl=document.getElementById('remain');
    rEl.textContent = (remain>0?'+':'') + remain;
    rEl.style.color = remain>=0?'#48b15a' : remain>=-4?'#d99a2b' : remain>=-9?'#e0793b' : '#e0524d';
    // 高亮处置档
    document.querySelectorAll('.tier').forEach(t=>{
      const mn = t.dataset.min!==undefined?+t.dataset.min:-Infinity;
      const mx = t.dataset.max!==undefined?+t.dataset.max:Infinity;
      t.classList.toggle('on', remain>=mn && remain<=mx);
    });
    // 今日得分（正负都会在保存后累计进账户）
    const tn = document.getElementById('todayNet');
    if(tn) tn.textContent = (remain>0?'+':'') + remain;
  }

  document.getElementById('reload').onclick = ()=>load(true);
  document.getElementById('print').onclick = ()=>window.print();

  // 自动轮询
  setInterval(()=>{ if(elAuto.checked) load(false); }, 2000);

  // 初始化：恢复收缩状态 + 上次打开的标签
  applyCollapsed(localStorage.getItem('navCollapsed') === '1');
  const savedId = localStorage.getItem('activeDoc');
  const startDoc = DOCS.find(d => d.id === savedId) || DOCS[0];
  switchDoc(startDoc);
</script>
